name: Lint Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.sh'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/lint-skills.sh'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint SKILL.md files
        run: bash ./scripts/lint-skills.sh

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bumps
        run: bash ./scripts/check-version-bump.sh --base origin/main
